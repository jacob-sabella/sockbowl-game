import cz.habarta.typescript.generator.ClassMapping
import cz.habarta.typescript.generator.EnumMapping
import cz.habarta.typescript.generator.JsonLibrary
import cz.habarta.typescript.generator.TypeScriptFileType
import cz.habarta.typescript.generator.TypeScriptOutputKind
import org.gradle.api.provider.ProviderFactory
import org.springframework.boot.gradle.tasks.bundling.BootBuildImage

plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'cz.habarta.typescript-generator' version '4.1.1'
}

group = 'com.soulsoftworks'
version = resolveVersion(providers)

java {
    // Java 17 reaches EOL Sept 2026; 25 is the current LTS (EOL Sept 2029).
    // A toolchain (rather than sourceCompatibility) pins the exact JDK used to
    // compile/test/run regardless of which JDK launched Gradle itself; the
    // foojay-resolver plugin (settings.gradle) auto-provisions it if missing.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3'
    }
    dependencies {
        // Spring Boot 4.1.1's BOM still manages lombok at 1.18.46; override so the
        // unversioned compileOnly/annotationProcessor declarations below pick up
        // the same 1.18.48 as the explicitly versioned `implementation` one and
        // the compile classpath and the annotation-processor path stay in sync.
        dependency 'org.projectlombok:lombok:1.18.48'
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.all {
    // The models jar is a moving target; always resolve the latest 1.0.+ .
    resolutionStrategy {
        cacheDynamicVersionsFor 0, 'seconds'
        cacheChangingModulesFor 0, 'seconds'
    }
}

// sockbowlquestions-models normally resolves from GitHub Packages, which
// 401s without read:packages credentials. For local dev without a token,
// publish it with `./gradlew publishToMavenLocal` in sockbowl-questions and
// build here with -PsockbowlUseMavenLocal=true (or SOCKBOWL_USE_MAVEN_LOCAL=
// true): that swaps GitHub Packages out for mavenLocal() so no request (and
// so no 401) is ever made against it. Neither is set in CI, so CI's
// resolution is unchanged.
boolean useMavenLocal = (findProperty('sockbowlUseMavenLocal') ?: System.getenv('SOCKBOWL_USE_MAVEN_LOCAL'))?.toString()?.toBoolean() ?: false

repositories {
    mavenCentral()
    if (useMavenLocal) {
        mavenLocal()
    } else {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY_OWNER') ?: 'jacob-sabella'}/sockbowl-questions")
            credentials {
                username = (System.getenv('GITHUB_ACTOR') ?: (findProperty('gpr.user') ?: '')) as String
                password = (System.getenv('GITHUB_TOKEN') ?: (findProperty('gpr.key') ?: '')) as String
            }
        }
    }
}

dependencies {
    // Transitive CVE fixes: these libs aren't declared directly, but pulled in below their
    // patched version by redis-om-spring (opennlp/djl via redisvl) and spring-cloud-starter-openfeign
    // (bouncycastle). Pin forward; remove once the parent bumps.
    constraints {
        implementation('org.apache.opennlp:opennlp-tools:2.5.12') {
            because 'CVEs: XXE in DictionaryEntryPersistor, arbitrary class instantiation via ExtensionLoader, OOM DoS (fixed 2.5.9+)'
        }
        implementation('ai.djl:api:0.38.0') {
            because 'CVE fix: path traversal issue (fixed 0.31.1+)'
        }
        implementation('ai.djl.huggingface:tokenizers:0.38.0') {
            because 'Kept in lockstep with ai.djl:api to avoid a binary-incompatible mismatch'
        }
        implementation('org.bouncycastle:bcprov-jdk18on:1.86') {
            because 'CVE fix: LDAP injection (fixed 1.84+)'
        }
    }

    // Answer judging (single-player auto-proctor): fuzzy string + phonetic match
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'commons-codec:commons-codec:1.22.1'
    // Packet/question domain contract — single source of truth: sockbowl-questions.
    implementation "com.soulsoftworks:sockbowlquestions-models:${sockbowlModelsVersion}"
    // The published entities carry Spring Data Neo4j annotations; provide them at
    // compile time only (game never persists — it deserializes GraphQL into them).
    compileOnly 'org.springframework.boot:spring-boot-starter-data-neo4j'
    testCompileOnly 'org.springframework.boot:spring-boot-starter-data-neo4j'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-okhttp:13.15'
    implementation 'io.github.openfeign:feign-httpclient:13.15'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'com.redis.om:redis-om-spring:2.0.10'
    implementation 'com.google.code.gson:gson:2.14.0'
    // M4 limiter core: Redis-backed token buckets (bucket4j over a dedicated
    // Lettuce connection; Redis OM keeps its own Jedis factory) and in-memory
    // per-connection buckets / small local caches (Caffeine). lettuce-core and
    // caffeine versions are managed by the Spring Boot BOM so they stay in step
    // with spring-data-redis.
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.20.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.20.0'
    implementation 'io.lettuce:lettuce-core'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.projectlombok:lombok:1.18.48'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    // Health endpoint only (see application.properties) for compose healthchecks.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.victools:jsonschema-generator:5.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Spring Security & OAuth2/OIDC
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Database & JPA for User persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'io.projectreactor:reactor-test'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // 2.0 renamed the JUnit 5 integration module from `junit-jupiter` to
    // `testcontainers-junit-jupiter` (same `org.testcontainers.junit.jupiter`
    // package; no source changes needed). com.redis:testcontainers-redis 2.x
    // is the 2.0-compatible successor to the old
    // com.redis.testcontainers:testcontainers-redis-junit-jupiter artifact;
    // same `com.redis.testcontainers.RedisContainer` type, no import changes.
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'com.redis:testcontainers-redis:2.2.4'
    // Real Postgres for the M4 ban/IP-ban ITs (the JPA side of D8 mirrors) and
    // the M4 quota-override IT (the JPA side of D10's mirror).
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    // Real Keycloak for the auth-on ITs (M2 WP-G4's QuestionsTokenProviderIT
    // mints service tokens from the shared test realm). 4.3.x targets
    // Testcontainers 2.0.x, matching the version pinned above.
    testImplementation 'com.github.dasniko:testcontainers-keycloak:4.3.1'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    // Matches the okhttp-jvm 5.x brought in transitively (e.g. by feign-okhttp);
    // the legacy 4.x 'mockwebserver' artifact is binary-incompatible with it.
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The packet/question domain contract lives in sockbowl-questions (single
// source of truth). The canonical GraphQL schema is synced into this repo via
// scripts/sync-schema.sh and the packet model POJOs are generated from it here
// instead of being hand-maintained.

generateTypeScript {
    jsonLibrary = JsonLibrary.jackson2
    classPatterns = ['com.soulsoftworks.sockbowlgame.model.**',]
    excludeClasses = [
            'com.soulsoftworks.sockbowlgame.model.state.GameSessionSanitizer',
            'com.soulsoftworks.sockbowlgame.model.socket.out.SockbowlMultiOutMessage'
    ]
    // Packet types are generated from the questions GraphQL schema; they are a
    // separate published contract (handled by ng codegen) and must NOT leak
    // into game's gameplay/message TypeScript output.
    excludeClassPatterns = [
            'com.soulsoftworks.sockbowlgame.model.**Builder**',
            'com.soulsoftworks.sockbowlgame.generated.packet.**'
    ]
    outputKind = TypeScriptOutputKind.module
    outputFile = "build/typescript-generation/sockbowl-interfaces.ts"
    outputFileType = TypeScriptFileType.implementationFile
    mapEnum = EnumMapping.asEnum
    nonConstEnums = true
    mapClasses = ClassMapping.asClasses
    generateConstructors = true
}

test {
    useJUnitPlatform()
}

/* ----------------------------- Spring Boot image --------------------------- */
bootBuildImage {
    createdDate = "now"
    def repo = (System.getenv('GITHUB_REPOSITORY') ?: 'OWNER/REPO')
    imageName = "ghcr.io/${repo}:${project.version}"
}

/* ------------------------------- Utilities -------------------------------- */
tasks.register('printVersion') {
    group = 'help'
    description = 'Prints the current project version'
    // Capture the version at configuration time into a local: reading it back
    // via the implicit `project` at execution time is deprecated (fails under
    // the configuration cache and in Gradle 10).
    def resolvedVersion = project.version
    doLast { println resolvedVersion }
}

static String resolveVersion(ProviderFactory providers) {
    // GitHub Actions refs look like:
    //  - refs/heads/feature/foo        (branch)
    //  - refs/tags/v1.2.3              (tag)
    //  - PRs: GITHUB_HEAD_REF is the source branch name
    String gitRef      = System.getenv('GITHUB_REF')
    String refName     = System.getenv('GITHUB_REF_NAME')   // branch or tag name for the current ref
    String headRef     = System.getenv('GITHUB_HEAD_REF')   // PR source branch
    String branchName  = null
    String releasePrefix = System.getenv('RELEASE_BRANCH_PREFIX') ?: 'release/'

    boolean isTagBuild    = (gitRef != null && gitRef.startsWith('refs/tags/'))
    boolean isBranchBuild = (gitRef != null && gitRef.startsWith('refs/heads/'))

    if (isTagBuild) {
        // vX.Y.Z -> X.Y.Z ; X.Y.Z -> X.Y.Z
        return stripLeadingV(refName)
    }

    // Determine branch name (CI or local)
    if (isBranchBuild) {
        branchName = refName
    } else if (headRef) {
        branchName = headRef
    } else {
        branchName = execAndRead(providers, "git", "rev-parse", "--abbrev-ref", "HEAD")
    }
    if (!branchName) branchName = "detached"

    if (branchName.startsWith(releasePrefix)) {
        // release/0.0.2 -> 0.0.2
        String ver = branchName.substring(releasePrefix.length())
        return ver ?: "0.0.0"
    }

    // Any other branch: just the sanitized branch name
    return sanitizeBranch(branchName)
}

static String stripLeadingV(String tag) {
    if (tag == null) return "0.0.0"
    return tag.startsWith("v") ? tag.substring(1) : tag
}

static String sanitizeBranch(String name) {
    // Lowercase; keep [a-z0-9._-]; convert others (including '/') to '-'
    return (name ?: "dev").toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9._-]", "-")
}

static String execAndRead(ProviderFactory providers, String... cmd) {
    try {
        // providers.exec (rather than a raw process spawn) is the
        // configuration-cache-friendly, non-deprecated way to run a process at
        // configuration time; see the Gradle 9 upgrade guide's note on
        // "Starting an external process at configuration time".
        def output = providers.exec {
            commandLine(cmd)
            ignoreExitValue = true
        }
        return output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        return null
    }
}