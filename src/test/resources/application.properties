# Disable authentication for tests
sockbowl.auth.enabled=false

# Disable datasource auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Redis and Kafka: an address where nothing listens. A developer's Redis or a
# network_mode: host compose stack on localhost:6379/9092 must never be picked
# up by a test (a context-loading test would otherwise join the live stack's
# game-consumers group and read or write its sessions). Tests that need Redis
# or Kafka point these at a Testcontainer via @DynamicPropertySource.
sockbowl.redis.game-cache.hostname=127.0.0.1
sockbowl.redis.game-cache.port=1
sockbowl.redis.game-cache.database=0


# Kafka
sockbowl.kafka.topic.game-topic=game-session-topic
# A closed port, never localhost:9092: a context's @KafkaListener would
# otherwise join the live broker's game-consumers group, take its partitions
# and commit offsets for commands the live game service never sees. Tests stub
# KafkaTemplate (StompSecurityITSupport) instead.
sockbowl.kafka.bootstrap-servers=127.0.0.1:1
spring.kafka.bootstrap-servers=127.0.0.1:1

# Sockbowl CORS config
sockbowl.websocket.allowed-origins=http://localhost

# M4: limiter off unless a test enables it (RateLimit*/Quota* tests build their
# own services against a Testcontainers Redis).
sockbowl.ratelimit.enabled=false
