# Spring
spring.mvc.converters.preferred-json-mapper=gson
server.port=${SOCKBOWL_PORT}

logging.level.org.apache.kafka=OFF

# Actuator - health only, for compose/orchestrator healthchecks. This is
# Spring Boot's own default exposure, made explicit so a later change can't
# accidentally widen it; see SecurityConfig/NoSecurityConfig for why
# /actuator/health is safe to expose unauthenticated.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Redis
sockbowl.redis.game-cache.hostname=${SOCKBOWL_REDIS_HOST}
sockbowl.redis.game-cache.port=${SOCKBOWL_REDIS_PORT}
sockbowl.redis.game-cache.database=${SOCKBOWL_DATABASE}

# Kafka
sockbowl.kafka.topic.game-topic=${SOCKBOWL_KAFKA_GAME_TOPIC}
sockbowl.kafka.bootstrap-servers=${SOCKBOWL_KAFKA_BOOTSTRAP_SERVERS}

# Sockbowl questions
sockbowl.questions.url=${SOCKBOWL_QUESTIONS_URL}

# Sockbowl CORS config
sockbowl.websocket.allowed-origins=${SOCKBOWL_GAME_ALLOWED_ORIGINS:http://localhost:4200}

# Authentication - Feature flag to enable/disable authentication
sockbowl.auth.enabled=${SOCKBOWL_AUTH_ENABLED:false}
# Every bearer token must carry this audience (Keycloak audience mapper on the
# sockbowl-game, sockbowl-game-backend and sockbowl-e2e clients).
sockbowl.auth.audience=${SOCKBOWL_AUTH_AUDIENCE:sockbowl-api}
# Tokens whose azp is this client are the backend service account, not a user:
# they cannot host, join, or reach /api/v1/user/**.
sockbowl.auth.service-client-id=${KEYCLOAK_GAME_BACKEND_CLIENT_ID:sockbowl-game-backend}

# User Database (separate from Keycloak) - only used if auth is enabled
spring.datasource.url=${SOCKBOWL_DB_URL:jdbc:postgresql://localhost:5432/sockbowl_users}
spring.datasource.username=${SOCKBOWL_DB_USERNAME:postgres}
spring.datasource.password=${SOCKBOWL_DB_PASSWORD:123456789}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT Resource Server (validate Keycloak tokens) - only used if auth is enabled.
# The decoder (config/JwtDecoderConfig) fetches keys from jwk-set-uri lazily, on
# the first token, so there is no OIDC discovery call at boot; the issuer and
# audience are validated on every token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://sockbowl.com:8080/realms/sockbowl}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}

# Service-account (client_credentials) registration used for server-to-server
# calls to sockbowl-questions. The provider names an explicit token-uri instead
# of an issuer-uri, so the registration is built without a discovery call and
# the service boots while Keycloak is still starting (AUTH-18). There is no
# user-login registration: ng runs the browser login flow itself.
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}
spring.security.oauth2.client.registration.questions-svc.provider=keycloak
spring.security.oauth2.client.registration.questions-svc.client-id=${sockbowl.auth.service-client-id}
spring.security.oauth2.client.registration.questions-svc.client-secret=${SOCKBOWL_GAME_BACKEND_SECRET:}
spring.security.oauth2.client.registration.questions-svc.authorization-grant-type=client_credentials
