# Spring
spring.mvc.converters.preferred-json-mapper=gson
server.port=${SOCKBOWL_PORT}

logging.level.org.apache.kafka=OFF

# Actuator - health only, for compose/orchestrator healthchecks. This is
# Spring Boot's own default exposure, made explicit so a later change can't
# accidentally widen it; see SecurityConfig/NoSecurityConfig for why
# /actuator/health is safe to expose unauthenticated.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Kafka-listener readiness (M2-LIVE-01, config.health.KafkaListenerReadinessHealthIndicator):
# DOWN until the game-consumers listener container has a non-empty partition
# assignment, so GET /actuator/health (the compose healthcheck) does not
# report the app healthy while a fresh consumer group is still rebalancing.
# probes.enabled also exposes it as its own GET /actuator/health/readiness
# group (component name: kafkaListenerReadiness) alongside Spring Boot's own
# readinessState, for a healthcheck that wants readiness specifically. Both
# paths stay detail-free (show-details=never applies to groups too).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,kafkaListenerReadiness

# Redis
sockbowl.redis.game-cache.hostname=${SOCKBOWL_REDIS_HOST}
sockbowl.redis.game-cache.port=${SOCKBOWL_REDIS_PORT}
sockbowl.redis.game-cache.database=${SOCKBOWL_DATABASE}

# Kafka
sockbowl.kafka.topic.game-topic=${SOCKBOWL_KAFKA_GAME_TOPIC}
sockbowl.kafka.bootstrap-servers=${SOCKBOWL_KAFKA_BOOTSTRAP_SERVERS}

# Sockbowl questions
sockbowl.questions.url=${SOCKBOWL_QUESTIONS_URL}
# A packet fetch runs on a Kafka listener thread; past this it fails with
# PACKET_SERVICE_UNAVAILABLE instead of hanging the listener (AUTH-18).
sockbowl.questions.timeout=${SOCKBOWL_QUESTIONS_TIMEOUT:10s}
# Connect/read timeout for the service-token call to Keycloak.
sockbowl.questions.token-timeout=5s

# Sockbowl CORS config
sockbowl.websocket.allowed-origins=${SOCKBOWL_GAME_ALLOWED_ORIGINS:http://localhost:4200}

# Authentication - Feature flag to enable/disable authentication
sockbowl.auth.enabled=${SOCKBOWL_AUTH_ENABLED:false}
# Every bearer token must carry this audience (Keycloak audience mapper on the
# sockbowl-game, sockbowl-game-backend and sockbowl-e2e clients).
sockbowl.auth.audience=${SOCKBOWL_AUTH_AUDIENCE:sockbowl-api}
# Tokens whose azp is this client are the backend service account, not a user:
# they cannot host, join, or reach /api/v1/user/**.
sockbowl.auth.service-client-id=${KEYCLOAK_GAME_BACKEND_CLIENT_ID:sockbowl-game-backend}

# User Database (separate from Keycloak) - only used if auth is enabled
spring.datasource.url=${SOCKBOWL_DB_URL:jdbc:postgresql://localhost:5432/sockbowl_users}
spring.datasource.username=${SOCKBOWL_DB_USERNAME:postgres}
spring.datasource.password=${SOCKBOWL_DB_PASSWORD:123456789}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT Resource Server (validate Keycloak tokens) - only used if auth is enabled.
# The decoder (config/JwtDecoderConfig) fetches keys from jwk-set-uri lazily, on
# the first token, so there is no OIDC discovery call at boot; the issuer and
# audience are validated on every token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://sockbowl.com:8080/realms/sockbowl}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}

# Service-account (client_credentials) registration used for server-to-server
# calls to sockbowl-questions. The provider names an explicit token-uri instead
# of an issuer-uri, so the registration is built without a discovery call and
# the service boots while Keycloak is still starting (AUTH-18). There is no
# user-login registration: ng runs the browser login flow itself.
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}
spring.security.oauth2.client.registration.questions-svc.provider=keycloak
spring.security.oauth2.client.registration.questions-svc.client-id=${sockbowl.auth.service-client-id}
spring.security.oauth2.client.registration.questions-svc.client-secret=${SOCKBOWL_GAME_BACKEND_SECRET:}
spring.security.oauth2.client.registration.questions-svc.authorization-grant-type=client_credentials

# ---------------------------------------------------------------------------
# M4 limits, quotas and abuse controls (plan m4-limits sections 2.1-2.5, 2.10).
# WP-G1 owns this block: later game WPs read these keys and must not edit this
# file. Capacities are overridable through the explicit ${SOCKBOWL_RL_*} /
# ${SOCKBOWL_QUOTA_*} placeholders (dashed map keys cannot be bound from env
# by relaxed binding, so every overridable value has a placeholder here).
# ---------------------------------------------------------------------------

# Client IP. The limiter keys guests by request.getRemoteAddr() only. Forwarded
# headers are trusted only with strategy=native AND an explicit proxy regex;
# LimitsStartupValidator fails startup on native with a blank regex (an empty
# internal-proxies regex would trust every peer).
server.forward-headers-strategy=${SOCKBOWL_FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${SOCKBOWL_TRUSTED_PROXIES_REGEX:}

# Rate limiting (D12: fail open on Redis errors, except fail-closed policies).
sockbowl.ratelimit.enabled=${SOCKBOWL_RATELIMIT_ENABLED:true}
sockbowl.ratelimit.redis.timeout=200ms
sockbowl.ratelimit.redis.connect-timeout=500ms
sockbowl.ratelimit.redis.reconnect-backoff=5s
sockbowl.ratelimit.service-clients=${SOCKBOWL_RL_SERVICE_CLIENTS:${sockbowl.auth.service-client-id}}
sockbowl.ratelimit.events.service=game
sockbowl.ratelimit.events.max-len=1000
sockbowl.ratelimit.events.sample-window=10s
sockbowl.ratelimit.exempt[0]=/actuator/health
sockbowl.ratelimit.exempt[1]=/actuator/health/**

sockbowl.ratelimit.tier-multipliers.guest=1.0
sockbowl.ratelimit.tier-multipliers.player=1.0
sockbowl.ratelimit.tier-multipliers.author=2.0
sockbowl.ratelimit.tier-multipliers.moderator=3.0
sockbowl.ratelimit.tier-multipliers.admin=10.0
sockbowl.ratelimit.tier-multipliers.service=1.0

# REST fallback for every non-exempt request (SERVICE tier uses "service" instead).
sockbowl.ratelimit.policies.default.capacity=${SOCKBOWL_RL_DEFAULT_CAPACITY:120}
sockbowl.ratelimit.policies.default.refill-period=${SOCKBOWL_RL_DEFAULT_REFILL_PERIOD:1m}
sockbowl.ratelimit.policies.default.key-by=user-or-ip
sockbowl.ratelimit.policies.service.capacity=${SOCKBOWL_RL_SERVICE_CAPACITY:6000}
sockbowl.ratelimit.policies.service.refill-period=${SOCKBOWL_RL_SERVICE_REFILL_PERIOD:1m}
sockbowl.ratelimit.policies.service.key-by=user
# Hosting: 5 per 10 minutes; a guest gets 0.6x (3), overriding the global multiplier.
sockbowl.ratelimit.policies.session-create.capacity=${SOCKBOWL_RL_SESSION_CREATE_CAPACITY:5}
sockbowl.ratelimit.policies.session-create.refill-period=${SOCKBOWL_RL_SESSION_CREATE_REFILL_PERIOD:10m}
sockbowl.ratelimit.policies.session-create.key-by=user-or-ip
sockbowl.ratelimit.policies.session-create.tier-multipliers.guest=0.6
# Join-code brute force: per IP regardless of identity.
sockbowl.ratelimit.policies.session-join.capacity=${SOCKBOWL_RL_SESSION_JOIN_CAPACITY:20}
sockbowl.ratelimit.policies.session-join.refill-period=${SOCKBOWL_RL_SESSION_JOIN_REFILL_PERIOD:1m}
sockbowl.ratelimit.policies.session-join.key-by=ip
sockbowl.ratelimit.policies.used-questions.capacity=${SOCKBOWL_RL_USED_QUESTIONS_CAPACITY:30}
sockbowl.ratelimit.policies.used-questions.refill-period=${SOCKBOWL_RL_USED_QUESTIONS_REFILL_PERIOD:1m}
sockbowl.ratelimit.policies.used-questions.key-by=user
sockbowl.ratelimit.policies.admin.capacity=${SOCKBOWL_RL_ADMIN_CAPACITY:120}
sockbowl.ratelimit.policies.admin.refill-period=${SOCKBOWL_RL_ADMIN_REFILL_PERIOD:1m}
sockbowl.ratelimit.policies.admin.key-by=user
# STOMP CONNECT, per IP, in Redis (WP-G3).
sockbowl.ratelimit.policies.ws-connect.capacity=${SOCKBOWL_RL_WS_CONNECT_CAPACITY:10}
sockbowl.ratelimit.policies.ws-connect.refill-period=${SOCKBOWL_RL_WS_CONNECT_REFILL_PERIOD:1m}
sockbowl.ratelimit.policies.ws-connect.key-by=ip
# STOMP SEND buckets are in-memory (LocalBucketRegistry, WP-G3).
sockbowl.ratelimit.policies.stomp-send.capacity=${SOCKBOWL_RL_STOMP_SEND_CAPACITY:40}
sockbowl.ratelimit.policies.stomp-send.refill-tokens=${SOCKBOWL_RL_STOMP_SEND_REFILL_TOKENS:20}
sockbowl.ratelimit.policies.stomp-send.refill-period=${SOCKBOWL_RL_STOMP_SEND_REFILL_PERIOD:1s}
sockbowl.ratelimit.policies.stomp-send.key-by=connection
sockbowl.ratelimit.policies.stomp-send-ip.capacity=${SOCKBOWL_RL_STOMP_SEND_IP_CAPACITY:120}
sockbowl.ratelimit.policies.stomp-send-ip.refill-tokens=${SOCKBOWL_RL_STOMP_SEND_IP_REFILL_TOKENS:60}
sockbowl.ratelimit.policies.stomp-send-ip.refill-period=${SOCKBOWL_RL_STOMP_SEND_IP_REFILL_PERIOD:1s}
sockbowl.ratelimit.policies.stomp-send-ip.key-by=ip
sockbowl.ratelimit.policies.stomp-buzz.capacity=${SOCKBOWL_RL_STOMP_BUZZ_CAPACITY:5}
sockbowl.ratelimit.policies.stomp-buzz.refill-tokens=${SOCKBOWL_RL_STOMP_BUZZ_REFILL_TOKENS:3}
sockbowl.ratelimit.policies.stomp-buzz.refill-period=${SOCKBOWL_RL_STOMP_BUZZ_REFILL_PERIOD:1s}
sockbowl.ratelimit.policies.stomp-buzz.key-by=connection
# Charged once per soft STOMP rejection; empty means ERROR frame and close.
sockbowl.ratelimit.policies.stomp-flood.capacity=${SOCKBOWL_RL_STOMP_FLOOD_CAPACITY:50}
sockbowl.ratelimit.policies.stomp-flood.refill-period=${SOCKBOWL_RL_STOMP_FLOOD_REFILL_PERIOD:10s}
sockbowl.ratelimit.policies.stomp-flood.key-by=connection

# G-M4-V1-03: a hard, non-token-bucket cap on live SUBSCRIBEs per connection.
sockbowl.ratelimit.stomp.max-subscriptions-per-connection=${SOCKBOWL_RL_STOMP_MAX_SUBSCRIPTIONS:16}

# REST route -> policies (all must pass; WP-G2's RequestGuardFilter also charges "default").
sockbowl.ratelimit.routes[0].method=POST
sockbowl.ratelimit.routes[0].pattern=/api/v1/session/create-new-game-session
sockbowl.ratelimit.routes[0].policies[0]=session-create
sockbowl.ratelimit.routes[1].method=POST
sockbowl.ratelimit.routes[1].pattern=/api/v1/session/join-game-session-by-code
sockbowl.ratelimit.routes[1].policies[0]=session-join
sockbowl.ratelimit.routes[2].method=POST
sockbowl.ratelimit.routes[2].pattern=/api/v1/session/join-game-session-authenticated
sockbowl.ratelimit.routes[2].policies[0]=session-join
sockbowl.ratelimit.routes[3].method=POST
sockbowl.ratelimit.routes[3].pattern=/api/v1/user/used-questions
sockbowl.ratelimit.routes[3].policies[0]=used-questions
sockbowl.ratelimit.routes[4].pattern=/api/v1/admin/**
sockbowl.ratelimit.routes[4].policies[0]=admin

# Quotas (D10, D11). -1 = unlimited. Metric names containing a dot need
# bracket notation. Game enforces hosted-sessions (WP-G5); the other metrics are
# enforced by questions and listed here so the admin usage API (WP-G6) reports
# the same limits.
sockbowl.quota.enabled=${SOCKBOWL_QUOTA_ENABLED:true}
sockbowl.quota.session-idle-timeout=30m
sockbowl.quota.session-touch-interval=1m
sockbowl.quota.daily-ttl=48h
sockbowl.quota.tiers.guest.hosted-sessions=${SOCKBOWL_QUOTA_GUEST_HOSTED_SESSIONS:2}
sockbowl.quota.tiers.player.hosted-sessions=${SOCKBOWL_QUOTA_PLAYER_HOSTED_SESSIONS:3}
sockbowl.quota.tiers.author.hosted-sessions=${SOCKBOWL_QUOTA_AUTHOR_HOSTED_SESSIONS:5}
sockbowl.quota.tiers.moderator.hosted-sessions=${SOCKBOWL_QUOTA_MODERATOR_HOSTED_SESSIONS:5}
sockbowl.quota.tiers.admin.hosted-sessions=-1
sockbowl.quota.tiers.guest.[ai.generations]=0
sockbowl.quota.tiers.player.[ai.generations]=0
sockbowl.quota.tiers.author.[ai.generations]=20
sockbowl.quota.tiers.moderator.[ai.generations]=20
sockbowl.quota.tiers.admin.[ai.generations]=-1
sockbowl.quota.tiers.guest.imports=0
sockbowl.quota.tiers.player.imports=0
sockbowl.quota.tiers.author.imports=10
sockbowl.quota.tiers.moderator.imports=10
sockbowl.quota.tiers.admin.imports=-1
sockbowl.quota.tiers.guest.packets-owned=0
sockbowl.quota.tiers.player.packets-owned=0
sockbowl.quota.tiers.author.packets-owned=300
sockbowl.quota.tiers.moderator.packets-owned=300
sockbowl.quota.tiers.admin.packets-owned=-1
# D11 global server-key budget (enforced in questions; shown by WP-G6).
sockbowl.ai.server-key.daily-budget=${SOCKBOWL_AI_SERVER_DAILY_BUDGET:200}
# Quota override mirror resync (WP-G5).
sockbowl.quota.overrides.resync-interval=5m

# Usage tracking (WP-G5): usage:{sub}:meta and usage:{sub}:ips.
sockbowl.usage.touch-interval=1m
sockbowl.usage.ips-kept=10
sockbowl.usage.ips-ttl=30d

# Subject bans: Redis mirror and local cache (WP-G4).
sockbowl.bans.cache-ttl=30s
sockbowl.bans.resync-interval=5m

# IP bans (D8, WP-G4): a TTL is required, capped here; no CIDR broader than
# /16 (IPv4) or /48 (IPv6).
sockbowl.ipban.max-ttl=30d
sockbowl.ipban.refresh-interval=15s
sockbowl.ipban.min-prefix-v4=16
sockbowl.ipban.min-prefix-v6=48

# STOMP transport limits (WP-G3) and the soft-reject notice throttle.
sockbowl.websocket.message-size-limit=16KB
sockbowl.websocket.send-buffer-size-limit=512KB
sockbowl.websocket.send-time-limit=15s
sockbowl.websocket.time-to-first-message=30s
sockbowl.websocket.rate-limited-notice-interval=1s
