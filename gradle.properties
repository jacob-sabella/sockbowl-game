# sockbowlquestions-models: 1.0.1 added Packet.visibility/ownerId mapping the
# SetMatchPacket draft check needs (M2 WP-Q2); 1.0.2 adds PacketVisibility.EPHEMERAL
# (WP-Q4, D15), which guest play needs, so 1.0.2 is the floor. Take the newest 1.0.x.
sockbowlModelsVersion=[1.0.2,1.1)

# CI-G (M6): the test job builds the models jar from source instead of resolving
# it from GitHub Packages (which 401s without a token), so it needs a ref of the
# public jacob-sabella/sockbowl-questions repo to check out and
# `publishToMavenLocal`. It must be a ref that exists on that remote. The
# build-and-publish job is unaffected and keeps resolving the published jar from
# GitHub Packages.
sockbowlQuestionsRef=main
