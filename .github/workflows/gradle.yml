name: Java CI with Gradle and Docker

on:
  push:
    branches:
      - "main"
      - "goal/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gradle/actions is pinned at v5, not the latest v6: v6 extracts its caching
# functionality into a separate `gradle-actions-caching` component under a
# proprietary commercial license (see
# https://blog.gradle.org/github-actions-for-gradle-v6), while v5 is a
# straightforward, MIT-licensed Node-24 bump from v4. Revisit if/when that
# licensing changes or the caching component is specifically wanted.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read sockbowlQuestionsRef from gradle.properties
        id: questions-ref
        run: |
          REF=$(grep -E '^sockbowlQuestionsRef=' gradle.properties | cut -d= -f2-)
          if [ -z "$REF" ]; then
            echo "sockbowlQuestionsRef not set in gradle.properties" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout sockbowl-questions (public, for the models jar)
        uses: actions/checkout@v7.0.1
        with:
          repository: jacob-sabella/sockbowl-questions
          ref: ${{ steps.questions-ref.outputs.ref }}
          path: sockbowl-questions

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Avoids the GitHub Packages 401 in CI: build the models jar from source
      # (at gradle.properties' sockbowlQuestionsRef) and publish it to this
      # runner's mavenLocal instead of resolving it from GitHub Packages. The
      # build-and-publish job below is unaffected and keeps the Packages path.
      - name: Publish sockbowlquestions-models to mavenLocal
        working-directory: sockbowl-questions
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test -PsockbowlUseMavenLocal=true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          files: |
            build/test-results/**/*.xml

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    # GHCR push only happens from main or a version tag; a goal/** or
    # release/** branch run, or a PR, never tries to push.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    # Credentials for resolving the sockbowlquestions-models artifact from
    # GitHub Packages (game's build.gradle reads these). The default
    # GITHUB_TOKEN works once the package grants sockbowl-game read access;
    # otherwise set a PACKAGES_TOKEN secret (a PAT with read:packages).
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compute project version
        id: ver
        run: |
          chmod +x gradlew
          echo "VERSION=$(./gradlew -q printVersion)" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image with Spring Boot (pack)
        run: ./gradlew bootBuildImage

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}:${{ env.VERSION }}"
          docker push "${IMAGE_TAG}"

          # Immutable per-commit tag for the deploy job (main only).
          if [ "${{ github.ref_name }}" == "main" ]; then
            SHA_TAG="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            docker tag "${IMAGE_TAG}" "${SHA_TAG}"
            docker push "${SHA_TAG}"
          fi

  # Continuous deployment: after the image for this commit is published, ask
  # the prod host to switch game to it. The key is restricted by a forced
  # command (sockbowl-docker scripts/deploy/ssh-deploy-gate.sh) to exactly
  # `deploy <service> <sha>`; the host pulls the sha-<sha> image, waits for
  # the healthcheck, and rolls back to the previous image if it fails.
  deploy:
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy-game
      cancel-in-progress: false
    steps:
      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_HOST" "deploy game ${GITHUB_SHA}"

  dependency-submission:
    runs-on: ubuntu-latest
    # Submitting the dependency graph is a write action; only do it from main
    # or a version tag, same as build-and-publish.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v5
